<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enrollment CMS Standalone</title>
<style>
body { font-family: sans-serif; margin: 2rem; }
form { margin-bottom: 1rem; }
input, button { padding: 0.5rem; margin-right: 0.5rem; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
</style>
</head>
<body>
<h1>Leads</h1>
<form id="leadForm">
  <input type="text" id="firstName" placeholder="First Name" required />
  <input type="text" id="lastName" placeholder="Last Name" required />
  <input type="email" id="email" placeholder="Email" required />
  <button type="submit">Add Lead</button>
</form>
<table id="leadTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Stage</th>
      <th>Temperature</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<script>
async function loadLeads() {
  try {
    const res = await fetch('/api/leads');
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    const tbody = document.querySelector('#leadTable tbody');
    tbody.innerHTML = '';
    (data.items || []).forEach(lead => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${lead.firstName} ${lead.lastName}</td><td>${lead.email}</td><td>${lead.stage}</td><td>${lead.temperature}</td>`;
      tbody.appendChild(tr);
    });
  } catch(err) {
    console.error(err);
  }
}

document.getElementById('leadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    consentEmail: true,
    consentSms: false
  };
  try {
    const res = await fetch('/api/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Request failed');
    document.getElementById('leadForm').reset();
    loadLeads();
  } catch(err) {
    alert(err.message);
  }
});

loadLeads();
</script>
</body>
</html>
